<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerf 2D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-desk app — header, left toolbox, attribute + tool-option strips, canvas sheet, right inspector, status bar */
:root{
  --desk:#e4e8e5; --panel:#f6f7f5; --panel-2:#eceeeb; --line:#cfd6d1; --fg:#1b2420; --muted:#5a6862;
  --accent:#0d6b5e; --accent-fg:#ffffff; --sheet:#ffffff; --grid:#cad4cf; --grid-major:#aebbb4;
  --ink:#15191c; --c-red:#e03131; --c-blue:#1c4fd8; --c-green:#2b8a3e; --c-magenta:#ae3ec9; --c-orange:#d9480f; --c-grey:#868e96;
  --sel:#d6336c; --source:#7048e8; --snap:#e67700; --ok:#2b8a3e; --bad:#c92a2a; --shadow:rgba(20,30,25,.14);
  --node-start:#2b8a3e; --node-end:#c92a2a; --node:#e67700;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#131819; --panel:#1b2123; --panel-2:#222a2c; --line:#2f393b; --fg:#e2e8e4; --muted:#94a29b;
  --accent:#3fbfa6; --accent-fg:#0b1513; --sheet:#1f2729; --grid:#2f3b3b; --grid-major:#41504f;
  --ink:#e9eeeb; --c-red:#ff6b6b; --c-blue:#7aa5ff; --c-green:#69db7c; --c-magenta:#e599f7; --c-orange:#ffa94d; --c-grey:#adb5bd;
  --sel:#f783ac; --source:#b197fc; --snap:#ffc078; --ok:#69db7c; --bad:#ff8787; --shadow:rgba(0,0,0,.45);
  --node-start:#69db7c; --node-end:#ff8787; --node:#ffc078; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#131819; --panel:#1b2123; --panel-2:#222a2c; --line:#2f393b; --fg:#e2e8e4; --muted:#94a29b;
  --accent:#3fbfa6; --accent-fg:#0b1513; --sheet:#1f2729; --grid:#2f3b3b; --grid-major:#41504f;
  --ink:#e9eeeb; --c-red:#ff6b6b; --c-blue:#7aa5ff; --c-green:#69db7c; --c-magenta:#e599f7; --c-orange:#ffa94d; --c-grey:#adb5bd;
  --sel:#f783ac; --source:#b197fc; --snap:#ffc078; --ok:#69db7c; --bad:#ff8787; --shadow:rgba(0,0,0,.45);
  --node-start:#69db7c; --node-end:#ff8787; --node:#ffc078; color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  display:grid;grid-template-columns:100px minmax(0,1fr) 296px;grid-template-rows:auto auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head head" "tools attr side" "tools opts side" "tools main side" "status status status";overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header{grid-area:head;display:flex;align-items:center;gap:12px;padding-block:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:600}
.brand b{font-size:15px}
.brand span{font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#docName{background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 6px;width:170px;min-width:0}
#docName:hover,#docName:focus{border-color:var(--line);background:var(--panel)}
.actions{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.files{display:flex;gap:4px}
.menu{position:relative}
.menu .pop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px var(--shadow);padding:4px;min-width:260px;display:flex;flex-direction:column}
.menu .pop[hidden]{display:none}
.menu .pop button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:0;background:none;color:var(--fg);padding:7px 10px;border-radius:6px;cursor:pointer;font:inherit}
.menu .pop button:hover,.menu .pop button:focus-visible{background:var(--panel-2)}
.menu .pop button span{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 10px;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
#tools{grid-area:tools;display:grid;grid-template-columns:44px 44px;gap:3px;padding:8px 6px;overflow:auto;align-content:start}
.tool{width:44px;height:40px;border:1px solid transparent;border-radius:6px;background:transparent;display:grid;place-items:center;position:relative;color:var(--fg);flex:none}
.tool:hover{background:var(--panel-2)}
.btn.ico{padding:4px 6px;line-height:0}
.row.align{gap:4px}
.flash{animation:kflash .4s ease-out}
@keyframes kflash{0%{background:var(--accent);color:var(--sheet);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}100%{}}
.tool[aria-pressed="true"]{background:var(--panel);border-color:var(--accent);color:var(--accent)}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool kbd{position:absolute;right:3px;bottom:1px;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:3px 4px;flex:none;grid-column:1/-1;align-self:center}
#tools .sep{height:1px}
#attr{grid-area:attr;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:6px 0 6px 8px;border-bottom:1px solid var(--line);min-width:0;min-height:42px;white-space:nowrap}
#attr .vsep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
#attr .bedin{width:58px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--fg)}
#attr label,#opts label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
#attr select,#opts select,#opts input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--fg)}
#opts input[type=text]{width:72px;font-family:var(--f-mono)}
#opts{grid-area:opts;display:flex;align-items:center;gap:6px 12px;min-height:42px;padding:5px 0 5px 8px;flex-wrap:wrap;white-space:nowrap;border-bottom:1px solid var(--line);min-width:0}
#toolOpts{row-gap:6px}
#opts .optname{font-weight:600;font-size:12px;color:var(--accent);flex:none}
#opts .hint{margin:0;flex:none}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.segc button{border:0;background:var(--panel);padding:2px 8px;font-size:12px;color:var(--muted)}
.segc button+button{border-left:1px solid var(--line)}
.segc.icons button{padding:1px 5px;line-height:0}
.segc.icons svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.segc button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#main{grid-area:main;position:relative;min-width:0;min-height:0;margin-left:8px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--fg);color:var(--desk);padding:6px 12px;border-radius:5px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;white-space:normal;text-align:center}
#toast.on{opacity:1}
#side{grid-area:side;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;margin-left:8px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;color:var(--muted);border-bottom:2px solid transparent;font-size:12px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.pane{padding:12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.pane h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center}
.grid2 label{color:var(--muted);font-size:12px}
.grid2 input[type=text],.grid2 select{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-family:var(--f-mono);font-size:12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:4px;font-size:12px}
/* on/off switch (a checkbox styled as a toggle) */
.tog{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.tog input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{left:16px}
.tog input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#lxSum{font-size:12.5px;line-height:1.5}
#lxSum .ok{color:#1a7f37;font-weight:600}
#lxSum .bad{color:#c62828;font-weight:600}
#lxSum table{border-collapse:collapse;margin:6px 0}
#lxSum td{padding:2px 8px 2px 0;vertical-align:middle}
#lxSum .sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:4px}
#lxSum details{margin-top:4px}
#lxSum ol{margin:4px 0 0 18px;padding:0}
.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0}
.layer{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:4px 6px;border-radius:5px}
.layer.cur{background:var(--panel-2)}
.layer input[type=text]{background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 4px;min-width:0}
.layer input[type=text]:focus{border-color:var(--line);background:var(--panel)}
.mini{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:2px}
.x{border:0;background:transparent;color:var(--muted);padding:0 4px}
table.res{width:100%;border-collapse:collapse;font-size:12px}
table.res td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.res td:last-child{text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600}
.pill.ok{color:var(--ok);border:1px solid var(--ok)}
.pill.bad{color:var(--bad);border:1px solid var(--bad)}
#pane details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
#pane details summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:4px 0}
#pane details[open] summary{margin-bottom:6px}
.summary{padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
#status{grid-area:status;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding-block:6px;align-items:center}
#prompt{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prompt b{color:var(--accent);font-weight:600;margin-right:6px}
.toggles{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.tg{border:1px solid var(--line);background:transparent;border-radius:4px;padding:2px 8px;font-size:11px;letter-spacing:.05em;font-weight:500;color:var(--muted)}
.tg .fk{font-family:var(--f-mono);font-size:9.5px;opacity:.7;margin-left:2px}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
#coord{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#cm{min-width:44px;font-family:var(--f-mono);font-weight:500}
#coord input{width:96px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-family:var(--f-mono)}
#coord label{color:var(--muted);font-size:11px}
#readout{display:flex;gap:14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
#readout span b{color:var(--fg);font-weight:500}
#modal{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(860px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px var(--shadow)}
#modal .head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#mOpts{padding:10px 14px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#mBody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:12px 14px;overflow:auto}
@media (max-width:640px){#mBody{grid-template-columns:1fr}}
#mPrev{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;place-items:center;min-height:160px}
#mPrev img{max-width:100%;max-height:52vh;display:block}
.xkinds{display:flex;gap:6px;flex-basis:100%;flex-wrap:wrap}
.xkinds button{flex:1 1 160px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px}
.xkinds button span{font-size:11.5px;color:var(--muted)}
.xkinds button[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.xkinds button[aria-checked="true"] b{color:var(--accent)}
#modal .foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:0 14px 12px;flex-wrap:wrap}
#modal .foot .hint{margin-right:auto}
.dropping-x{}
#boxmaker{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;z-index:21;padding:12px}
#boxmaker .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(1000px,100%);height:min(680px,calc(100dvh - 24px));display:flex;flex-direction:column;box-shadow:0 10px 40px var(--shadow)}
#boxmaker .head,#boxmaker .foot{display:flex;gap:8px;align-items:center;padding:10px 14px}
#boxmaker .head{justify-content:space-between;border-bottom:1px solid var(--line)}
#boxmaker .foot{justify-content:flex-end;border-top:1px solid var(--line);flex-wrap:wrap}
#boxmaker .foot .hint{margin-right:auto;color:var(--bad)}
#boxmaker .x{border:0;background:none;color:var(--fg);font-size:16px;cursor:pointer}
#boxmaker .body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 290px}
#boxmaker .view{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--sheet);padding:10px}
#boxmaker svg{flex:1;min-height:0;width:100%}
#boxmaker svg path{fill:color-mix(in srgb,var(--accent) 8%,transparent);stroke:var(--ink);stroke-width:.4;vector-effect:non-scaling-stroke;stroke-linejoin:miter}
#boxmaker svg text{font-size:5px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle;font-family:var(--f-sans,sans-serif)}
#boxmaker .ctl{overflow:auto;padding:12px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
#boxmaker .sl{display:grid;grid-template-columns:1fr 70px auto;gap:6px;align-items:center;font-size:12.5px}
#boxmaker .stat{font-size:12px;color:var(--muted);margin:6px 0 0}
#boxmaker svg .sheet{fill:var(--panel);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#boxmaker svg .marg{fill:none;stroke:var(--muted);stroke-dasharray:4 3;stroke-width:.6;vector-effect:non-scaling-stroke}
#boxmaker svg .fixed{fill:color-mix(in srgb,var(--muted) 18%,transparent);stroke:var(--muted)}
#boxmaker svg text.sh{font-size:8px;text-anchor:start;dominant-baseline:auto;fill:var(--muted)}
#boxmaker.classroom .box{width:min(560px,100%);height:auto;max-height:calc(100dvh - 24px)}
#boxmaker.classroom.wide .box{width:min(900px,100%)}
#boxmaker .cbody{padding:12px 16px;overflow:auto;display:flex;flex-direction:column;gap:9px;min-height:0}
#boxmaker .cbody h4{margin:6px 0 0;font-size:13px}
#boxmaker.classroom .sl{grid-template-columns:110px 1fr}
#boxmaker .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
#boxmaker .checks li{display:flex;gap:8px;align-items:baseline}
#boxmaker .checks li span{flex:1}
#boxmaker b.ok{color:var(--accent)} #boxmaker b.warn{color:#c77700} #boxmaker b.stop,#boxmaker span.stop{color:var(--bad)}
#boxmaker .link{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
#boxmaker .ctable{overflow:auto;max-height:min(55dvh,520px);border:1px solid var(--line);border-radius:6px}
#boxmaker table{border-collapse:collapse;width:100%;font-size:12.5px}
#boxmaker th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;border-bottom:1px solid var(--line)}
#boxmaker th,#boxmaker td{padding:5px 8px;vertical-align:top}
#boxmaker tr+tr td{border-top:1px solid var(--line)}
#boxmaker tr.old td{color:var(--muted)}
#boxmaker.classroom .foot .hint{color:var(--muted)}
#boxmaker .hrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#boxmaker .hrow .sl{grid-template-columns:auto 1fr}
#boxmaker input.ini{text-transform:uppercase;letter-spacing:.08em;font-size:16px;font-weight:600;max-width:110px}
#boxmaker input.bad{border-color:var(--bad);outline:1px solid var(--bad)}
#boxmaker .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
#boxmaker span.warn{color:#c77700;font-size:11.5px;white-space:nowrap}
#boxmaker #cWatch{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:6px;padding:6px 9px;margin:0}
@media (max-width:520px){#boxmaker .hrow{grid-template-columns:1fr}}
#boxmaker svg path.bad{stroke:var(--bad);fill:color-mix(in srgb,var(--bad) 14%,transparent);stroke-width:.8}
#boxmaker svg circle.hit{fill:none;stroke:var(--bad);stroke-width:1.2;vector-effect:non-scaling-stroke}
#boxmaker .np.bad span{color:var(--fg)} #boxmaker .np.bad b{color:var(--bad);font-weight:600}
#boxmaker .nparts{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
#boxmaker .np{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
#boxmaker .np svg{width:38px;height:28px;flex:none}
#boxmaker .np input{width:48px}
@media (max-width:760px){#boxmaker .body{grid-template-columns:1fr;grid-template-rows:45% 1fr}#boxmaker .ctl{border-left:0;border-top:1px solid var(--line)}}
#hinge{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;z-index:21;padding:12px}
#hinge .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(1180px,100%);height:min(820px,calc(100dvh - 24px));display:flex;flex-direction:column;box-shadow:0 10px 40px var(--shadow)}
#hinge .head,#hinge .foot{display:flex;gap:10px;align-items:center;padding:9px 14px}
#hinge .head{border-bottom:1px solid var(--line);flex-wrap:wrap}
#hinge .head strong{margin-right:6px}
#hinge .head .x{margin-left:auto;border:0;background:none;color:var(--fg);font-size:16px;cursor:pointer}
#hinge .foot{border-top:1px solid var(--line);align-items:flex-end}
#hinge .foot .warn{margin-right:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px;max-height:110px;overflow:auto;min-width:0}
#hinge .foot .warn .btn{font-size:12px;padding:3px 9px}

#laserWs .lw-player{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#laserWs .lw-player input[type=range]{flex:1 1 200px;accent-color:var(--accent)}
#laserWs .lw-msg{margin:0;padding:0 16px 8px;font-size:13px;min-height:1.2em}
#laserWs .lw-step{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--sheet)}
#laserWs .lw-sh{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
#laserWs .lw-n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
#laserWs .lw-step:not(.open) .lw-n{background:var(--line);color:var(--fg)}
#laserWs .lw-sh b{font-size:14.5px}
#laserWs .lw-sum{font-size:12.5px;color:var(--muted);flex-basis:100%;padding-left:36px}
#laserWs .lw-sb{padding:0 12px 12px 48px;display:flex;flex-direction:column;gap:8px;font-size:13px}
#laserWs .lw-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#laserWs .lw-row label{display:flex;align-items:center;gap:6px}
#laserWs input[type=text],#laserWs select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel);min-width:0}
#laserWs .lw-row input[type=text]{width:64px}
#laserWs #lwName{width:150px}
#laserWs .lw-help{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45;background:var(--panel-2);border-radius:6px;padding:6px 8px}
#laserWs .lw-help.small{font-size:11.5px;padding:0;background:none;margin-top:2px;font-weight:400}
#laserWs .lw-link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font:inherit;cursor:pointer}
#laserWs #lwOri{width:100%;max-width:300px;height:auto;border-radius:6px;cursor:pointer;background:var(--panel)}
#laserWs .btn[aria-pressed="true"],#laserWs .btn.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#laserWs .btn{padding:6px 12px}
#laserWs .btn[disabled]{opacity:.5;cursor:not-allowed}
#laserWs .lw-op{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
#laserWs .lw-op.off{opacity:.6}
#laserWs .lw-oph{display:flex;align-items:center;gap:6px}
#laserWs .lw-oph b{margin-right:auto}
#laserWs .lw-opf{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#laserWs .lw-opf label{display:flex;align-items:center;gap:4px}
#laserWs .lw-opf input[type=text]{width:52px}
#laserWs .lw-opf small{color:var(--muted)}
#laserWs .lw-read.small{font-size:12px;color:var(--muted)}
#laserWs .lw-set{border-collapse:collapse;width:100%}
#laserWs .lw-lay{border-collapse:collapse;width:100%;font-size:12.5px}
#laserWs .lw-lay th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:center;padding:0 2px 4px;line-height:1.15;white-space:nowrap}
#laserWs .lw-lay th small{display:block;font-size:10px}
#laserWs .lw-lay td{padding:3px 2px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
#laserWs .lw-lay td:first-child{text-align:left;max-width:90px;overflow:hidden;text-overflow:ellipsis}
#laserWs .lw-lay tr.off td{opacity:.5}
#laserWs .lw-lay input[type=text]{width:46px;padding:3px 4px;text-align:right}
#laserWs .tog.sm{justify-content:center}
#laserWs .tog.sm input{width:28px;height:16px}
#laserWs .tog.sm input::after{width:12px;height:12px}
#laserWs .tog.sm input:checked::after{left:14px}
#laserWs .lw-row.small{font-size:12px;gap:14px}
#laserWs .lw-cut{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
#laserWs .lw-set th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:2px 4px;line-height:1.2}
#laserWs .lw-set td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:middle}
#laserWs .lw-set td:first-child{width:40%}
#laserWs .lw-set input[type=text]{width:52px}
#laserWs .sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:2px}
#laserWs .lw-cards{display:flex;flex-direction:column;gap:6px}
#laserWs .lw-cards button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px}
#laserWs .lw-cards button span{font-size:12px;color:var(--muted)}
#laserWs .lw-cards button[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#laserWs .lw-cards button[aria-checked="true"] b{color:var(--accent)}
#laserWs .lw-read{margin:0}
#laserWs .lw-big{margin:0;font-size:18px}
#laserWs .ok{color:#1a7f37;margin:0;font-weight:600}
#laserWs .bad{color:#c62828;margin:0;font-weight:600}
@media (max-width:820px){#laserWs .lw-body{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,1fr);overflow:auto}#laserWs .lw-steps{border-right:0;border-bottom:1px solid var(--line);overflow:visible}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Kerf 2D</b><span>precision drafting · v1.6</span></div>
  <div class="files">
    <button class="btn" id="bNew" title="Start a new drawing">New</button>
    <button class="btn" id="bOpen" title="Open a Kerf drawing, or bring in an SVG, DXF or picture">Open…</button>
    <button class="btn" id="bSave" title="Save this drawing to work on later">Save</button>
  </div>
  <input id="docName" aria-label="Drawing name" value="Glasses front">
  <div class="actions">
    <div class="menu" id="mkMenu">
      <button class="btn" id="bMake" aria-haspopup="true" aria-expanded="false" title="Box maker, elements and picture tracing">Make ▾</button>
      <div class="pop" role="menu" hidden>
        <button role="menuitem" id="bBox"><b>Box maker…</b><span>Finger-jointed box, kerf compensated</span></button>
        <button role="menuitem" id="bHinge"><b>Living hinge…</b><span>Bendy wood: wrap a shape, or test strips</span></button>
        <button role="menuitem" id="bBend"><b>Bend to a profile…</b><span>Leaf, face, wing: bend wood to a curve you draw</span></button>
        <button role="menuitem" id="bNest"><b>Nest on sheet…</b><span>Fit lots of parts (e.g. 30 key rings) with little waste</span></button>
        <button role="menuitem" id="bClassLoad"><b>Load class designs…</b><span>All your pupils' handed-in files at once, then nest</span></button>
        <button role="menuitem" id="bClassList"><b>Class list…</b><span>Who is on which sheet · find a pupil's design</span></button>
        <button role="menuitem" id="bElements"><b>Elements…</b><span>Hearts, animals, key-ring blanks… and your own</span></button>
        <button role="menuitem" id="bSaveEl"><b>Save selection as element…</b><span>Keep your design to use again</span></button>
        <button role="menuitem" id="bTrace"><b>Trace image…</b><span>Turn a picture into outlines (or drop / paste one)</span></button>
      </div>
    </div>
    <button class="btn" id="bHandIn" title="Pupils: check your design and save it to send to your teacher">Hand in</button>
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">Redo</button>
    <button class="btn" id="bFit" title="Zoom to page (F)">Fit page</button>
    <button class="btn" id="bHelp" title="How to use the tool you have picked, with pictures">? Help</button>
    <button class="btn primary" id="bExport" title="Save a file for the laser (LightBurn), or an SVG / DXF">Export</button>
    <button class="btn primary" id="bLaser" title="Laser workspace: settings, position on the bed, preview and time">Laser</button>
    <input type="file" id="classIn" accept=".json,.zip" multiple hidden>
    <input type="file" id="fileIn" accept=".json,.dxf,.svg,.png,.jpg,.jpeg,.gif,.webp,.bmp" hidden><input type="file" id="imgIn" accept="image/*" hidden>
  </div>
</header>
<nav id="tools" aria-label="Drawing tools"></nav>
<div id="attr">
  <label>Layer <select id="aLayer"></select></label>
  <span class="colpick"><span class="clab">Colour</span> <button type="button" id="aColorBtn" class="colbtn" aria-haspopup="true" aria-expanded="false" title="Colour palette — and what the laser does with each colour"><i id="aColorSw"></i><span id="aColorTxt"></span> ▾</button><div class="colpop" id="aColorPop" hidden></div></span>
  <label>Width <select id="aWidth"></select></label>
  <span class="vsep"></span>
  <label title="Bed / material size (the white sheet)">Bed <select id="aBed"></select></label>
  <input type="text" id="aBedW" class="mono bedin" aria-label="Bed width mm"><span class="hint">×</span><input type="text" id="aBedH" class="mono bedin" aria-label="Bed height mm"><span class="hint">mm</span>
</div>
<div id="opts"><span class="optname" id="optName">Select</span><div id="toolOpts" class="row" style="flex-wrap:wrap;gap:6px 12px;min-width:0;flex:1 1 0"></div></div>
<div id="main"><canvas id="cv" aria-label="Drawing sheet"></canvas><div id="toast" role="status"></div></div>
<aside id="side">
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="props" aria-selected="true">Properties</button>
    <button role="tab" data-tab="layers" aria-selected="false">Layers</button>
    <button role="tab" data-tab="aids" aria-selected="false">Setup</button>
    <button role="tab" data-tab="test" aria-selected="false">Accuracy</button>
    <button role="tab" data-tab="help" aria-selected="false" class="helptab" title="How to use each tool, with pictures">? Help</button>
  </div>
  <div class="pane" id="pane"></div>
</aside>
<footer id="status">
  <div id="prompt"></div>
  <div class="toggles" id="toggles"></div>
  <div id="coord">
    <button class="btn" id="cm" title="Cycle Abs / Rel / Pol (Alt+A, Alt+R, Alt+P)">Abs</button>
    <label for="ca" id="laA">X</label><input id="ca" class="mono" inputmode="decimal" autocomplete="off">
    <label for="cb" id="laB">Y</label><input id="cb" class="mono" inputmode="decimal" autocomplete="off">
    <button class="btn" id="cOk">Enter</button>
  </div>
  <div id="readout"></div>
</footer>
<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="head"><strong id="mTitle">Export</strong><button class="x" id="mClose" aria-label="Close">✕</button></div>
    <div id="mOpts"></div>
    <div id="mBody"><div id="mPrev"><img id="mImg" alt="Picture of what will be exported"></div><div id="lxSum"></div></div>
    <div class="foot"><p class="hint" id="mHint"></p><button class="btn primary" id="mSave">Save file</button></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
